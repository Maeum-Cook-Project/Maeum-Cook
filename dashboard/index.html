<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Kitchen Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        h1 { 
            color: #333; 
            margin-bottom: 20px;
        }

        /* 상단 연결 상태 표시줄 */
        .status-container {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        #connection-status {
            padding: 12px 24px;
            border-radius: 20px;
            font-weight: bold;
            transition: all 0.3s ease;
            min-width: 250px;
            text-align: center;
        }

        .status-button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        #config-button {
            background-color: #2196F3;
            color: white;
        }

        #config-button:hover {
            background-color: #1976D2;
        }

        #reconnect-button {
            background-color: #4CAF50;
            color: white;
        }

        #reconnect-button:hover {
            background-color: #45a049;
        }

        /* 그리드 레이아웃 */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 900px;
        }

        /* 기기 카드 디자인 */
        .card {
            background-color: white;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            border: 2px solid transparent;
            opacity: 0.7; /* 기본은 꺼진 상태(흐림) */
        }

        /* 기기가 켜졌을 때 스타일 */
        .card.active {
            opacity: 1;
            border-color: #4caf50;
            background-color: #e8f5e9;
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(76, 175, 80, 0.3);
        }

        .icon { 
            font-size: 60px; 
            margin-bottom: 15px; 
            display: block; 
        }
        
        .name { 
            font-size: 1.5em; 
            font-weight: bold; 
            margin-bottom: 10px; 
            color: #555; 
        }
        
        .status { 
            font-size: 1.2em; 
            color: #888; 
            font-weight: bold; 
        }
        
        /* 켜졌을 때 텍스트 색상 */
        .card.active .status { 
            color: #2e7d32; 
        }

        /* 화력 표시 (인덕션 전용) */
        .level-info {
            margin-top: 10px;
            font-size: 1em;
            color: #ff9800;
            display: none; /* 기본 숨김 */
            font-weight: bold;
        }
        .card.active .level-info { 
            display: block; 
        }

        /* 설정 모달 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 16px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
            color: #333;
        }

        .modal-subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
            text-align: center;
        }

        .modal-label {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            margin-top: 12px;
            display: block;
        }

        .modal-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 12px;
        }

        .modal-input:focus {
            outline: none;
            border-color: #2196F3;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .modal-button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-button-cancel {
            background-color: #f5f5f5;
            color: #333;
        }

        .modal-button-cancel:hover {
            background-color: #e0e0e0;
        }

        .modal-button-save {
            background-color: #2196F3;
            color: white;
        }

        .modal-button-save:hover {
            background-color: #1976D2;
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            
            .status-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <h1>🍳 Smart Kitchen Monitor</h1>
    
    <div class="status-container">
        <div id="connection-status">서버 연결 대기 중... (❌)</div>
        <button id="config-button" class="status-button">⚙️ 설정</button>
        <button id="reconnect-button" class="status-button">🔄 재연결</button>
    </div>

    <div class="dashboard">
        <div id="card-induction" class="card">
            <span class="icon">🔥</span>
            <div class="name">인덕션</div>
            <div id="status-induction" class="status">OFF</div>
            <div class="level-info">화력: <span id="level-induction">0</span>단</div>
        </div>

        <div id="card-fan" class="card">
            <span class="icon">💨</span>
            <div class="name">환풍기</div>
            <div id="status-fan" class="status">OFF</div>
        </div>

        <div id="card-sink" class="card">
            <span class="icon">🚰</span>
            <div class="name">싱크대</div>
            <div id="status-sink" class="status">OFF</div>
        </div>
    </div>

    <!-- 설정 모달 -->
    <div id="config-modal" class="modal">
        <div class="modal-content">
            <div class="modal-title">서버 설정</div>
            <div class="modal-subtitle">QCS6490 보드의 IP 주소와 포트 번호를 입력하세요</div>
            
            <label class="modal-label">IP 주소</label>
            <input type="text" id="ip-input" class="modal-input" placeholder="예: 192.168.0.3">
            
            <label class="modal-label">포트 번호</label>
            <input type="number" id="port-input" class="modal-input" placeholder="예: 8765" min="1" max="65535">
            
            <div class="modal-buttons">
                <button id="config-cancel" class="modal-button modal-button-cancel">취소</button>
                <button id="config-save" class="modal-button modal-button-save">저장</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
